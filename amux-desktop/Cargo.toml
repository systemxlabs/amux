[package]
name = "amux-desktop"
description = "桌面应用（docs/DESIGN.md「应用」）：经 HTTPS 对接 Server，三面板视图、会话交互、终端、改动审查与设置"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "amux_desktop"
path = "src/lib.rs"

[[bin]]
name = "amux-desktop"
path = "src/main.rs"

[dependencies]
amux-common.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest.workspace = true
parking_lot.workspace = true
base64.workspace = true
jiff.workspace = true

# GPUI（Zed 主线 git）+ gpui-component（longbridge）
# 注意：跟踪 Zed 主线，API 可能随上游变化。
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_component = { package = "gpui-component", git = "https://github.com/longbridge/gpui-component", rev = "d4b3aee7801a0c56364f509e391a099251183d56" }
gpui_component_assets = { package = "gpui-component-assets", git = "https://github.com/longbridge/gpui-component", rev = "d4b3aee7801a0c56364f509e391a099251183d56" }

[dev-dependencies]
tempfile.workspace = true
axum = { workspace = true }
