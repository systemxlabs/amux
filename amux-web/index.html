<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：软键盘弹出时收缩布局视口，
         使 100dvh 的根容器随之变矮，输入区不会被键盘挡住 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>amux</title>
    <!-- 内联 SVG 图标：避免浏览器请求不存在的 /favicon.ico（静态托管下会 404） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234a86d8'/%3E%3Cpath d='M4 11V5h2.2l1.8 3 1.8-3H12v6h-1.6V7.8L8.6 10.5h-.9L6 7.8V11z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
