[package]
name = "server"
description = "每台机器的常驻进程：WS 传输、JSON-RPC 分发、会话管理、会话数据聚合与 activities 缓存、git 能力；经 ACP 官方 SDK 与 agent 通信"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util = "0.3"
# ACP 官方 SDK（docs/DESIGN.md §9）；当前 driver 为内存 Stub，接入 ACP stdio 时启用
agent-client-protocol = { version = "1", features = ["unstable"] }

[[bin]]
name = "mock_acp"
path = "tests/support/mock_acp.rs"
