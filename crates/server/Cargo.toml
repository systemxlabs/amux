[package]
name = "amux-server"
description = "每台机器的常驻进程：WS 传输、JSON-RPC 分发、会话管理、会话数据聚合与 activities 缓存、git 能力；经 ACP 官方 SDK 与 agent 通信"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
protocol = { package = "amux-protocol", path = "../protocol" }
amux-common = { path = "../common" }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# 按需声明特性：macros(select!/main/test)、rt-multi-thread、net、process、io-util、signal、sync、time
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "io-util", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
futures-util = "0.3"
# 强类型错误（rpc 边界一次映射 JSON-RPC 错误码）
thiserror = "2"
# ACP 官方 SDK（docs/DESIGN.md §9）：Client 角色 + schema v1 + AcpAgent stdio 传输
agent-client-protocol = { workspace = true, features = ["unstable"] }
uuid.workspace = true
parking_lot.workspace = true
# 会话注册表持久化（docs/DESIGN.md §3.3/§4.3：server 单写者，同步 API）
rusqlite = { version = "0.40", features = ["bundled"] }
# git 能力（workspace.diff/restore）用 gitoxide；只开用到的特性以精简依赖树
gix = { version = "0.87", default-features = false, features = ["basic", "status", "sha1"] }
portable-pty = "0.9"
base64 = "0.22"

[[bin]]
name = "mock_acp"
path = "tests/support/mock_acp.rs"

# 测试/演示入口：启动 server 但 agent 固定为 mock_acp（见 src/bin/test-server.rs）
[[bin]]
name = "test-server"
path = "src/bin/test-server.rs"
