[package]
name = "server"
description = "每台机器的常驻进程：WS 传输、JSON-RPC 分发、会话管理、会话数据聚合与 activities 缓存、git 能力；经 ACP 官方 SDK 与 agent 通信"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util = "0.3"
# ACP 官方 SDK（docs/DESIGN.md §9）：Client 角色 + schema v1 + AcpAgent stdio 传输
agent-client-protocol = { version = "1", features = ["unstable"] }
uuid.workspace = true
# 会话注册表持久化（docs/DESIGN.md §3.3/§4.3：server 单写者，同步 API）
rusqlite = { version = "0.32", features = ["bundled"] }
gix = "0.86.0"

[[bin]]
name = "mock_acp"
path = "tests/support/mock_acp.rs"

# 测试/演示入口：启动 server 但 agent 固定为 mock_acp（见 src/bin/test-server.rs）
[[bin]]
name = "test-server"
path = "src/bin/test-server.rs"
