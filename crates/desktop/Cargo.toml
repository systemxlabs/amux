[package]
name = "amux-desktop"
description = "GPUI 桌面应用（docs/DESIGN.md / PRD §桌面 GUI 设计）：三面板视图、对话流、会话活动页、diff 编辑器、侧边栏、设置页；会话历史本地缓存"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
protocol = { package = "amux-protocol", path = "../protocol" }
amux-common = { path = "../common" }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# 按需声明特性：macros(select!/test)、rt-multi-thread、net、sync、time（心跳）
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite.workspace = true
uuid.workspace = true
parking_lot.workspace = true
futures-util = "0.3"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }

# GPUI（Zed 主线 git）+ gpui-component（longbridge）
# 注意：跟踪 Zed 主线，API 可能随上游变化（docs/DESIGN.md §7）
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_component = { package = "gpui-component", git = "https://github.com/longbridge/gpui-component" }
gpui_component_assets = { package = "gpui-component-assets", git = "https://github.com/longbridge/gpui-component" }
# 本地时区时间戳格式化（PRD「消息气泡包含时间」；跨天需日期）
jiff = "0.2"
# rig-core：编排 agent 的 LLM provider 层（completion/providers/streaming/test-utils）。
# 直接依赖 rig-core 而非 rig facade，避免拉入 rig-agent / rig-derive
#（steer/取消语义由引擎自研工具循环驱动，不使用 agent 运行时；
#  流式输出参考 rig-agent 的流式运行时自行消费，文本增量实时进对话流）
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
alacritty_terminal = "0.25"

# 测试专用：rig-core MockCompletionModel/MockTurn（薄工具循环单测；不进 release 构建）
[dev-dependencies]
rig-core = { version = "0.42", default-features = false, features = ["test-utils"] }
tempfile.workspace = true
# gpui 测试平台：真实 taffy 布局 + 事件模拟（复现滚动/布局回归）
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
