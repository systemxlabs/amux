[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/protocol",
    "crates/server",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# agent-client-protocol 1.3.0（ACP 官方 SDK）要求 rustc ≥ 1.88
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic-write-file = "=0.3.1"
log = "0.4"
logforth = { version = "0.30", features = ["starter-log"] }
tokio = { version = "1" }
tokio-tungstenite = "0.30"
agent-client-protocol = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "=0.12.5"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"

# dev 构建只保留行号表：gpui 级别的依赖全量 debuginfo 会让二进制膨胀到数百 MB，
# 在内存紧张的机器上链接抖动近停滞；行号表足以支撑 panic 回溯定位。
[profile.dev]
debug = "line-tables-only"
