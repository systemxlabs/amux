[workspace]
resolver = "2"
members = [
    "amux-common",
    "amux-daemon",
    "amux-server",
    "amux-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# agent-client-protocol（ACP 官方 SDK）要求 rustc ≥ 1.88
rust-version = "1.89"

[workspace.dependencies]
amux-common = { path = "amux-common" }
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.34"
logforth = { version = "0.30", features = ["starter-log"] }
tokio = { version = "1" }
tokio-tungstenite = "0.30"
axum = "0.8"
# 只开 fs：Server 需要按 `--web` 目录托管 Web 应用的构建产物（docs/DESIGN.md「Server 启动」）
tower-http = { version = "0.6.8", default-features = false, features = ["fs"] }
agent-client-protocol = "2.1.0"
uuid = { version = "1.26.0", features = ["v4"] }
parking_lot = "=0.12.5"
tempfile = "=3.27.0"
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 只开 status / sha1：daemon 需要「仓库访问 + status（dirwalk、忽略规则、attributes、过滤）」
# 这一整套跨子系统能力（DESIGN「Daemon 技术栈 - Git：gix」）；改用细粒度子 crate 需自行复刻
# 那几百行装配，才能去掉伞 crate 非可选带进来的 gix-protocol / gix-revision
gix = { version = "0.87.1", default-features = false, features = ["status", "sha1"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
jiff = "0.2.35"
percent-encoding = "2.3.2"
rig-core = { version = "0.42.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.42.0", default-features = false }
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
alacritty_terminal = "0.26.0"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
lto = "thin"

# dev 构建只保留行号表：gpui 级别的依赖全量 debuginfo 会让二进制膨胀到数百 MB，
# 在内存紧张的机器上链接抖动近停滞；行号表足以支撑 panic 回溯定位。
[profile.dev]
debug = "line-tables-only"

# zed 的 git 依赖在 gpui-component 中未固定 rev，与本项目的 gpui/gpui_platform
# 同源同分支，cargo 会统一解析到同一提交；若未来依赖图里出现两份 gpui
#（类型不互通），需显式 [patch] 钉到相同提交。
