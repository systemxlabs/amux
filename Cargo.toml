[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# agent-client-protocol 1.3.0（ACP 官方 SDK）要求 rustc ≥ 1.88
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
agent-client-protocol = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
