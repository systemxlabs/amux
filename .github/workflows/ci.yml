name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Rust workspace 门禁：格式、lint 和所有 crate 的测试。
  check:
    name: fmt + clippy + workspace test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate lockfile
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

  # Web 应用门禁：类型检查与构建（tsc --noEmit && vite build）、纯逻辑单测（vitest）。
  # amux-web 不是 Cargo 成员，与 Rust 门禁并行执行、互不阻塞。
  web:
    name: web build + unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与开发环境一致；Vite 7 要求 Node ≥ 20.19 / ≥ 22.12
          node-version: "22"
          cache: npm
          cache-dependency-path: amux-web/package-lock.json

      - name: Install dependencies
        working-directory: amux-web
        run: npm ci --no-audit --no-fund

      # build 脚本为 `tsc --noEmit && vite build`：类型错误在此直接失败
      - name: Typecheck and build
        working-directory: amux-web
        run: npm run build

      - name: Unit tests
        working-directory: amux-web
        run: npm test

      - name: Verify build output
        working-directory: amux-web
        run: |
          # 页面外壳必须存在，且它引用的构建产物真实存在
          test -f dist/index.html
          js=$(grep -o '/assets/[^"]*\.js' dist/index.html | head -1)
          css=$(grep -o '/assets/[^"]*\.css' dist/index.html | head -1)
          test -n "$js" && test -n "$css"
          test -f "dist$js" && test -f "dist$css"
          echo "构建产物: $js $css"

      - name: Working tree must stay clean
        run: |
          # 安装与构建不得污染工作区：产物必须被 .gitignore 覆盖（dist/、node_modules/、*.tsbuildinfo）
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::安装/构建污染了工作区：请把新增产物加入 .gitignore，或改为不落盘"
            exit 1
          fi

