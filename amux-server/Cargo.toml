[package]
name = "amux-server"
description = "公网枢纽：Client HTTPS API、Daemon WebSocket 接入、ACP v2 client 多路复用、会话/工作流存储与编排智能体"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
amux-common.workspace = true
clap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-tungstenite.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
parking_lot.workspace = true
uuid.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
agent-client-protocol = { workspace = true, features = ["unstable_protocol_v2"] }
base64.workspace = true
rig-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
# 编排工具循环用脚本化 completion model 驱动（rig 的 test-utils 仅在测试构建启用）
rig-core = { workspace = true, features = ["test-utils"] }

# 测试用模拟 ACP v2 agent（真实 stdio 路径，与 codex-acp-v2 等真实 agent 交互一致）
[[bin]]
name = "mock_acp"
path = "tests/support/mock_acp.rs"
